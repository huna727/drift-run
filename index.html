<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Drift Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff;--line:#0b0820;--hot:#e3262e;--sun:#ffd23f;--mint:#7dff3a;--sky:#2f9bff;--grape:#34296f;--grape2:#1e1750;--hz:repeating-linear-gradient(-45deg,#2f9bff 0 7px,#fff 7px 11px,#2f9bff 11px 18px);
  --outl:0 3px 0 var(--line),2px 0 0 var(--line),-2px 0 0 var(--line),0 -2px 0 var(--line),2px 2px 0 var(--line),-2px 2px 0 var(--line);
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2f2f7a;color:var(--ink);font-family:"Russo One","Arial Black","Impact",system-ui,sans-serif;font-weight:400;letter-spacing:.2px;touch-action:none;overscroll-behavior:none}
body.touch{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block}
button{font-family:inherit}
#hud{position:fixed;inset:0;pointer-events:none;user-select:none}

/* ---------- cartoon panels ---------- */
.panel{position:absolute;background:linear-gradient(180deg,var(--grape),var(--grape2));border:5px solid transparent;border-image:var(--hz) 5;border-radius:0;padding:10px 16px;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.panel.flat{border:0;border-image:none}
#drift{top:calc(18px + var(--sat));left:calc(84px + var(--sal));min-width:270px;border:0;border-image:none;background:linear-gradient(90deg,#d6212b 0 10px,rgba(22,40,66,.92) 10px);clip-path:polygon(0 0,100% 0,95% 100%,0 100%);padding:8px 34px 8px 24px}
#drift::after{content:"";position:absolute;left:10px;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#ffd23f var(--bank,0%),rgba(255,255,255,.12) 0)}
#obj{font-size:13px;margin-top:4px;color:var(--sun)}
#score{font-size:46px;line-height:1;font-style:italic;text-shadow:var(--outl)}
#mult{font-size:22px;font-weight:400;color:var(--sun);margin-left:8px;text-shadow:var(--outl)}
#meta{font-size:14px;opacity:.95;margin-top:4px}
#speedo{position:absolute;right:calc(104px + var(--sar));bottom:calc(14px + var(--sab));width:178px;height:178px}
#dial{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
#needle{transform-origin:100px 100px;transition:transform .08s linear}
#gearBox{position:absolute;right:-34px;top:-6px;width:58px;height:62px;background:#3a0b10;border:4px solid #0b0820;display:grid;place-items:center;font-size:46px;color:#ff3b30;font-style:italic;line-height:1;box-shadow:0 3px 0 #0b0820}
#spdBox{position:absolute;right:-48px;top:62px;min-width:76px;background:#1b1020;border:4px solid #0b0820;color:#ffd23f;text-align:right;padding:2px 8px;font-size:30px;font-style:italic;line-height:1.1}
#spdBox small{display:block;font-size:11px;color:#fff;opacity:.8}
#speed small{display:none}
#boostbar{position:absolute;right:-72px;bottom:0;width:20px;height:118px;background:#0b0820;border:3px solid #0b0820;display:flex;align-items:flex-end;overflow:hidden}
#boostfill{display:block;width:100%;height:100%;background:linear-gradient(0deg,#7dff3a,#ffd23f 65%,#e3262e)}
#tire{position:absolute;right:-82px;bottom:-30px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#ddd 0 22%,#111 24% 100%);border:3px solid #0b0820;box-shadow:inset 0 0 0 5px #222}
#help{left:18px;bottom:18px;padding:6px 14px}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:44px;font-style:italic;color:#8dff3a;-webkit-text-stroke:7px #0b0820;paint-order:stroke fill;text-shadow:0 5px 0 #0b0820;opacity:0;white-space:nowrap}
#toast.bad{color:#ff5a4d}
#toast.show{animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,12px) scale(.7) rotate(-4deg)}12%{opacity:1;transform:translate(-50%,0) scale(1.12) rotate(2deg)}25%{transform:translate(-50%,0) scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}

/* ---------- always-on buttons: settings (top left) + speed classes (top right) ---------- */
#ui{position:fixed;inset:0;pointer-events:none;z-index:4}
.cbtn,.cls{pointer-events:auto;border:3px solid var(--line);cursor:pointer;color:var(--line);box-shadow:0 5px 0 var(--line),inset 0 3px 0 rgba(255,255,255,.45);transition:transform .08s,box-shadow .08s}
.cbtn:active,.cls:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line),inset 0 3px 0 rgba(255,255,255,.45)}
.cbtn:focus-visible,.cls:focus-visible{outline:3px solid #fff;outline-offset:2px}
#btnSettings{position:absolute;top:calc(18px + var(--sat));left:calc(18px + var(--sal));width:56px;height:56px;border-radius:50%;background:var(--sky);display:grid;place-items:center;padding:0}
#btnSettings svg{width:34px;height:34px;fill:var(--line);transition:transform .4s}
#btnSettings:hover svg{transform:rotate(90deg)}
#photoX{position:absolute;top:calc(18px + var(--sat));left:calc(86px + var(--sal));height:56px;padding:0 20px;border-radius:28px;background:var(--hot);color:#fff;font-size:20px;font-weight:400;display:none;text-shadow:0 2px 0 var(--line)}
body.photo #photoX{display:block}
#classes{position:absolute;top:calc(18px + var(--sat));right:calc(18px + var(--sar));display:flex;gap:10px}
.cls{width:58px;height:66px;border-radius:6px;transform:skewX(-8deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.cls b{font-size:28px;font-weight:400}
.cls small{font-size:11px;font-weight:400;opacity:.75;margin-top:2px}
.cls.c1{background:var(--mint)}.cls.c2{background:var(--sun)}.cls.c3{background:var(--hot);color:#fff}
.cls.c3 small{opacity:.9}
.cls.on{transform:translateY(-3px) scale(1.12);outline:3px solid #fff;outline-offset:1px;box-shadow:0 8px 0 var(--line),inset 0 3px 0 rgba(255,255,255,.45)}
body.photo #classes,body.inmenu #ui{display:none}
body.photo #hud{display:none}

/* ---------- touch controls ---------- */
#touch{position:fixed;inset:0;display:none;z-index:3;touch-action:none}
body.touch.playing #touch{display:block}
.zone{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;touch-action:none}
#zoneL{left:0}#zoneR{right:0}
body.ctrl-tilt .zone,body.photo.touch .zone{pointer-events:auto}
.tbtn{position:absolute;border:4px solid var(--line);color:#fff;font-weight:400;cursor:pointer;touch-action:none;box-shadow:0 7px 0 var(--line),inset 0 4px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 var(--line);transition:transform .06s,box-shadow .06s;padding:0;line-height:1.05;opacity:.93}
.tbtn.down,.tbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line),inset 0 4px 0 rgba(255,255,255,.4);filter:brightness(1.15)}
.pedal{bottom:calc(16px + var(--sab));height:96px;border-radius:30px;font-size:24px}
.pedal.gas{right:calc(16px + var(--sar));width:132px;background:var(--mint)}
.pedal.brake{left:calc(16px + var(--sal));width:104px;background:var(--hot)}
.mini{width:70px;height:70px;border-radius:50%;font-size:12px}
.mini.hb{left:calc(20px + var(--sal));bottom:calc(128px + var(--sab));background:var(--sky);color:var(--line);text-shadow:none}
.mini.kick{left:calc(100px + var(--sal));bottom:calc(128px + var(--sab));background:#b388ff}
.mini.boost{right:calc(30px + var(--sar));bottom:calc(128px + var(--sab));background:var(--sun);color:var(--line);text-shadow:none;font-size:13px}
#steer{display:none}
.steer{bottom:calc(18px + var(--sab));width:88px;height:88px;border-radius:50%;font-size:34px;background:var(--sky);color:var(--line);text-shadow:none}
#tL{left:calc(16px + var(--sal))}#tR{left:calc(116px + var(--sal))}
body.ctrl-btn #steer{display:block}
body.ctrl-btn .pedal.brake{left:auto;right:calc(166px + var(--sar));width:92px}
body.ctrl-tilt .tbtn.pedal{pointer-events:none}
body.photo.touch .tbtn{display:none}
#tip{position:absolute;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);background:#fff;color:var(--line);border:3px solid var(--line);border-radius:18px;padding:8px 16px;font-size:15px;font-weight:400;box-shadow:0 4px 0 var(--line);opacity:0;pointer-events:none;white-space:nowrap;max-width:92vw}
#tip.show{animation:tip 5s ease-out forwards}
@keyframes tip{0%{opacity:0;transform:translate(-50%,10px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
#rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--grape2);font-size:26px;text-align:center;padding:24px;text-shadow:var(--outl)}
#rotate div{font-size:84px;animation:turn 1.8s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.touch.playing #rotate{display:flex}}

/* touch HUD: compact so nothing sits under thumbs */
body.touch #help{display:none}
body.touch #drift{top:calc(10px + var(--sat));left:calc(78px + var(--sal));min-width:0;padding:5px 12px;border-radius:16px}
body.touch #btnSettings{top:calc(10px + var(--sat));left:calc(12px + var(--sal));width:52px;height:52px}
body.touch #classes{top:calc(10px + var(--sat));right:calc(12px + var(--sar));gap:8px}
body.touch .cls{width:52px;height:60px}
body.touch #score{font-size:30px}
body.touch #mult{font-size:16px}
body.touch #meta{font-size:11px;margin-top:2px}
body.touch #obj{font-size:11px;margin-top:2px}
body.touch #speedo{left:calc(50% - 20px);right:auto;transform:translateX(-50%);bottom:calc(10px + var(--sab));width:118px;height:118px}
body.touch #gearBox{width:40px;height:44px;font-size:30px;right:-26px}
body.touch #spdBox{font-size:20px;right:-34px;top:44px;min-width:56px}
body.touch #boostbar,body.touch #tire{display:none}
body.touch #toast{top:16%;font-size:30px}

/* ---------- menus ---------- */
#menu{position:fixed;inset:0;pointer-events:none;z-index:5}
#menu.off{display:none}
.mpanel{pointer-events:auto;position:absolute;top:18px;bottom:18px;left:18px;width:min(440px,calc(100vw - 36px));display:flex;flex-direction:column;padding:0;overflow:hidden}
.mpanel.compact{bottom:auto;width:min(400px,calc(100vw - 36px));max-height:calc(100% - 36px);overflow-y:auto}
#mRight{left:auto;right:18px;bottom:auto;width:min(290px,calc(100vw - 36px));padding:16px 18px;max-height:calc(100% - 36px);overflow:auto}
#mRight:empty{display:none}
.mhead{padding:16px 18px 8px}
.mhead.row{display:flex;justify-content:space-between;align-items:baseline}
.mhead h2,#mRight h3,.grp h3{margin:0;font-weight:400}
.mhead h2{font-size:32px;font-style:italic;text-shadow:var(--outl)}
.mtitle{margin:0;font-size:clamp(46px,9vw,66px);font-style:italic;line-height:.95;transform:skewX(-6deg);color:var(--sun);text-shadow:0 5px 0 var(--line),3px 0 0 var(--line),-3px 0 0 var(--line),0 -3px 0 var(--line),3px 3px 0 var(--line),-3px 3px 0 var(--line)}
.msub{margin:10px 0 0;font-size:15px;line-height:1.35;opacity:.95}
.mbtns{display:flex;flex-direction:column;gap:12px;padding:10px 18px 18px}
.mscroll{overflow-y:auto;padding:4px 18px 14px;flex:1;scrollbar-width:thin;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:10px;padding:12px 18px;border-top:3px solid #2f9bff;background:rgba(10,8,32,.4);font-size:14px}
.mfoot.col{flex-direction:column;gap:8px}
.row{display:flex;gap:10px}
.row>.btn{flex:1}
.dim{opacity:.75;font-size:13px;margin-top:6px}
.note{font-size:13px;color:var(--sun);min-height:1.2em}
.cash{font-size:24px;font-weight:400;color:var(--sun);text-shadow:var(--outl)}
.btn{font-size:18px;font-style:italic;text-transform:uppercase;color:#0b0820;background:linear-gradient(180deg,#ffe36b,#ffc21a);border:0;border-radius:0;padding:12px 28px;cursor:pointer;text-align:center;clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);transition:filter .08s,transform .08s}
.btn:hover{filter:brightness(1.12)}
.cls:hover{transform:translateY(-2px) rotate(-3deg)}
.cbtn:hover{filter:brightness(1.08)}
.card:hover,.chip:hover,.segb:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);filter:brightness(.95)}
.btn.primary{background:linear-gradient(180deg,#ff5a4d,#d6212b);color:#fff;text-shadow:0 2px 0 var(--line)}
.btn.blue{background:linear-gradient(180deg,#63b6ff,#2f86e8)}
.btn.dis{background:linear-gradient(180deg,#a8ff72,#5fd12a);color:#0b0820;text-shadow:none;cursor:default}
.btn.big{font-size:26px;padding:14px 26px}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;margin-top:12px;padding:12px 14px;border:3px solid #2f9bff;border-radius:0;background:rgba(10,8,32,.45);color:var(--ink);font:inherit;text-align:left;cursor:pointer;clip-path:polygon(0 0,100% 0,98% 100%,0 100%)}
.card:hover{background:rgba(255,255,255,.14)}
.card.sel{background:linear-gradient(90deg,#d6212b,#7a1a40);border-color:#fff}
.cname{font-size:21px;font-style:italic}
.ctag{font-weight:400;color:var(--sun);text-shadow:0 2px 0 var(--line)}
.card.sel .ctag{color:#fff}
.cdesc{grid-column:1/-1;font-size:13px;opacity:.9}
.grp{margin-top:16px}
.grp h3{font-size:18px;color:var(--sun);padding-bottom:4px;border-bottom:3px dashed rgba(255,255,255,.25);text-shadow:0 2px 0 var(--line)}
.ctl{margin-top:10px}
.clab{display:flex;justify-content:space-between;font-size:15px;font-weight:400}
.clab b{color:var(--sun);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;margin:4px 0 0;accent-color:var(--sun);cursor:pointer;touch-action:pan-y}
.hint{font-size:12px;line-height:1.35;opacity:.75;font-weight:500}
.chips,.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip,.segb{font-size:14px;color:var(--line);background:#fff;border:0;border-radius:0;padding:6px 16px;cursor:pointer;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
.chip:active,.segb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip.sel,.segb.sel{background:var(--hot);color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0;box-shadow:0 3px 0 var(--line)}
.sw.sel{outline:3px solid #fff;outline-offset:1px}
#mRight h3{font-size:20px;text-shadow:var(--outl)}
.stat{margin-top:10px}
.slab{display:flex;justify-content:space-between;font-size:14px;font-weight:400}
.delta.up{color:#6dffa8}.delta.dn{color:#ff9db0}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun),var(--hot));border-radius:6px}
.bal{margin-top:14px;font-size:16px}
/* settings rows */
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.tl b{font-size:15px}
.tog{flex:none;width:58px;height:32px;border-radius:16px;border:3px solid var(--line);background:#6b5fb0;position:relative;cursor:pointer;padding:0;box-shadow:0 3px 0 var(--line);transition:background .15s}
.tog i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:transform .15s}
.tog.on{background:var(--mint)}
.tog.on i{transform:translateX(26px)}
.btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btnrow .btn{font-size:15px;padding:8px 14px}
.wheelrow{display:flex;align-items:center;gap:16px;margin-top:12px}
.wheel{flex:none;width:84px;height:84px;border-radius:50%;border:9px solid var(--sun);box-shadow:0 0 0 3px var(--line),inset 0 0 0 3px var(--line),0 5px 0 3px var(--line);background:radial-gradient(circle at 50% 3%,var(--hot) 0 7px,transparent 8px),linear-gradient(var(--sun),var(--sun)) center/100% 9px no-repeat,linear-gradient(var(--sun),var(--sun)) 50% 100%/9px 50% no-repeat,var(--grape2);will-change:transform}
.keys{font-size:13px;line-height:1.7;margin-top:8px}
.keys{font-size:13px;line-height:2}
.keys kbd,#help kbd{background:#fff;color:var(--line);border:2px solid var(--line);border-radius:6px;padding:0 6px;font:inherit;font-weight:400;box-shadow:0 2px 0 var(--line)}



/* ---------- garage frame (top bar, PLAY / SELL, car switcher) ---------- */
#garage{position:fixed;inset:0;pointer-events:none;z-index:6;display:none}
body.g-on #garage{display:block}
body.g-on .mpanel{top:calc(76px + var(--sat));bottom:14px;left:14px}
body.g-on .mpanel.compact{bottom:auto}
body.g-on #mRight{left:auto;right:14px;bottom:auto}
#gbar{position:absolute;left:0;right:0;top:0;height:calc(58px + var(--sat));padding:var(--sat) 14px 0;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#3b2f7e,#1e1750);border-bottom:6px solid transparent;border-image:var(--hz) 6;pointer-events:auto;box-shadow:0 6px 16px rgba(0,0,0,.4)}
#gBack{font-size:26px;font-style:italic;color:#fff;background:#0b0820;border:0;padding:6px 22px 6px 14px;cursor:pointer;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);text-shadow:0 2px 0 #000}
#gBack.hide{visibility:hidden}
#gSlot{font-size:26px;font-style:italic;color:#fff;text-shadow:var(--outl);margin-left:auto;display:flex;align-items:center;gap:10px}
#gSlot i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#3ddc5a;border:3px solid #0b0820;font-style:normal;font-size:24px;line-height:1;color:#0b0820}
#gCash{margin-left:auto;font-size:24px;font-style:italic;color:#ffd23f;text-shadow:var(--outl)}
#gCash em{font-style:normal;color:#fff;background:#d99a00;border-radius:50%;padding:0 6px;margin:0 6px 0 12px;border:2px solid #0b0820}
#gPlay,#gSell{position:absolute;right:calc(18px + var(--sar));pointer-events:auto;cursor:pointer;border:0;font-family:inherit;font-style:italic;text-transform:uppercase}
#gPlay{bottom:calc(94px + var(--sab));width:210px;height:92px;font-size:46px;color:#0b0820;background:linear-gradient(180deg,#ffe36b,#ffc21a);clip-path:polygon(0 0,100% 0,100% 100%,0 100%);border-left:0;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 0 0 5px #0b0820}
#gPlay:hover,#gSell:hover{filter:brightness(1.1)}
#gPlay:active{transform:translateY(3px)}
#gSell{bottom:calc(16px + var(--sab));width:150px;height:62px;font-size:22px;line-height:1.05;color:#fff;background:#d6212b;box-shadow:inset 0 0 0 4px #0b0820;display:none}
body.g-sell #gSell{display:block}
#gPick{position:absolute;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);display:flex;align-items:center;gap:14px;pointer-events:auto}
#gPick button{width:56px;height:56px;border:0;background:rgba(11,8,32,.75);color:#fff;font-size:42px;line-height:1;cursor:pointer;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);font-family:inherit}
#gPick button:hover{background:#2f9bff}
#gOwned{min-width:160px;text-align:center;font-size:22px;font-style:italic;color:#fff;text-shadow:var(--outl)}
#gSpec{position:absolute;left:480px;bottom:calc(86px + var(--sab));font-size:15px;line-height:1.35;font-style:italic;color:#fff;-webkit-text-stroke:3px #0b0820;paint-order:stroke fill;pointer-events:none}
@media (max-width:1000px){#gSpec{display:none}}
@media (max-width:640px){#gPlay{width:150px;height:70px;font-size:32px;bottom:calc(80px + var(--sab))}#gSell{width:110px;height:50px;font-size:17px}#gPick{left:auto;right:calc(18px + var(--sar));transform:none;bottom:calc(150px + var(--sab));flex-direction:row}}

/* ---------- multiplayer ---------- */
#mp{position:fixed;inset:0;pointer-events:none;z-index:2;display:none;user-select:none}
body.mp #mp{display:block}
#mp.off{display:none!important}
body.mp #hud,body.mp #classes{display:none}
.pv{position:absolute;overflow:hidden}
.divl{position:absolute;background:var(--line);box-shadow:0 0 0 2px #fff;z-index:1}
.pchip{position:absolute;top:10px;left:10px;padding:3px 14px;border:3px solid var(--line);border-radius:999px;color:var(--line);font-size:20px;font-weight:400;box-shadow:0 3px 0 var(--line)}
.pv[data-i="0"] .pchip{left:calc(76px + var(--sal))}
.pips{position:absolute;top:12px;right:12px;font-size:22px;letter-spacing:3px;text-shadow:var(--outl)}
.pv[data-i="1"] .pips,.pv[data-i="3"] .pips{right:14px}
.psub{position:absolute;left:12px;bottom:10px;font-size:15px;font-weight:400;text-shadow:var(--outl)}
.phint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--line);border:3px solid var(--line);border-radius:14px;padding:4px 12px;font-size:13px;font-weight:400;box-shadow:0 3px 0 var(--line);transition:opacity .6s}
.pout{display:none;position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) rotate(-6deg);font-size:clamp(34px,7vw,80px);font-weight:400;color:var(--hot);text-shadow:var(--outl)}
.pv.dead .pout{display:block}
.pv.dead{background:rgba(29,18,69,.35)}
.pv.board{background:linear-gradient(180deg,var(--grape),var(--grape2));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;font-size:clamp(18px,3vw,28px);font-weight:400}
.bt{font-size:1.2em;color:var(--sun);text-shadow:var(--outl)}
.brow{display:flex;align-items:center;gap:10px}
.pdot{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid var(--line);flex:none}
#mpBanner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(36px,9vw,92px);font-weight:400;color:var(--sun);text-shadow:0 5px 0 var(--line),3px 0 0 var(--line),-3px 0 0 var(--line),0 -3px 0 var(--line),3px 3px 0 var(--line),-3px 3px 0 var(--line);white-space:nowrap;opacity:0;z-index:3}
#mpBanner.show{animation:bpop 1s ease-out forwards}
@keyframes bpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}22%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.05)}}
/* map picker */
.map{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:10px 12px;border:3px solid var(--line);border-radius:16px;background:rgba(29,18,69,.35);color:var(--ink);font:inherit;font-weight:600;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.map:not(.locked):hover{background:var(--hot);transform:translateY(-2px) rotate(-.5deg)}
.mthumb{position:relative;flex:none;width:96px;height:66px;border:3px solid var(--line);border-radius:12px;display:grid;place-items:center;font-style:normal}
.mthumb i{font-style:normal;font-size:28px}
.mthumb.t1{background:radial-gradient(circle at 70% 78%,#e9e1d4 0 9%,transparent 10%),linear-gradient(#ff9a6c,#6b4bd6 70%,#2c2f36 70%)}
.mthumb.t2{background:linear-gradient(#18d6c0,#e83fa0 72%,#243b55 72%)}
.mthumb.t3{background:linear-gradient(#bfe9ff,#6fa8ff 72%,#f4fbff 72%)}
.minfo{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.minfo b{font-size:20px}.minfo span{font-size:12px;opacity:.85;font-weight:500}
.map.locked{cursor:not-allowed}
.map.locked .mthumb{filter:grayscale(.9) brightness(.65)}
.map.locked .minfo{opacity:.55}
.sign{position:absolute;right:-6px;top:-12px;transform:rotate(6deg);background:var(--sun);color:var(--line);border:3px solid var(--line);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:400;letter-spacing:.5px;box-shadow:0 3px 0 var(--line);background-image:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(29,18,69,.12) 8px 16px)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.prow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.prow b{font-size:17px}.pcar{min-width:78px;text-align:center;font-weight:400;color:var(--sun)}
.pkeys{flex-basis:100%;font-size:12px;opacity:.8;margin-left:28px}
@media (max-width:640px){#mRight{display:none}}
@media (max-height:520px){
  .mpanel{top:8px;bottom:8px;left:8px}
  .mpanel.compact{max-height:calc(100% - 16px)}
  .mhead{padding:10px 14px 4px}.mhead h2{font-size:26px}
  .mtitle{font-size:42px}.msub{font-size:13px;margin-top:6px}
  .mbtns{gap:9px;padding:6px 14px 12px}.btn.big{font-size:20px;padding:8px 14px}
  .mfoot{padding:8px 14px;font-size:12px}.mfoot .dim{display:none}
  .card{padding:8px 12px;margin-top:9px}.cname{font-size:18px}
}
@media (prefers-reduced-motion:reduce){#toast.show,#tip.show{animation-duration:.01s}#rotate div{animation:none}}
</style>
</head>
<body>
<div id="hud">
  <div id="drift" class="panel"><div><span id="score">0</span><span id="mult"></span></div><div id="meta">Angle <b id="angle">0</b>° · Banked <b id="total">0</b> · Best <b id="best">0</b> · Cash $<b id="cash">0</b></div><div id="obj"></div></div>
  <div id="help" class="panel"><div class="keys"><kbd>W</kbd> gas <kbd>S</kbd> brake <kbd>A</kbd><kbd>D</kbd> steer<br><kbd>Space</kbd> handbrake <kbd>Shift</kbd> boost <kbd>E</kbd> kick<br><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> speed <kbd>P</kbd> photo <kbd>C</kbd> cam <kbd>R</kbd> reset<br><kbd>Esc</kbd> menu</div></div>
  <div id="speedo"><svg id="dial" viewBox="0 0 200 200" aria-hidden="true"></svg><div id="gearBox"><span id="gearN">N</span></div><div id="spdBox"><span id="speed">0<small></small></span><small>km/h</small></div><div id="boostbar"><i id="boostfill"></i></div><div id="tire"></div></div>
  <div id="toast"></div>
</div>

<div id="mp" class="off"><div id="mpBanner" role="status"></div></div>

<div id="touch">
  <div id="zoneL" class="zone"></div><div id="zoneR" class="zone"></div>
  <div id="steer"><button id="tL" class="tbtn steer" aria-label="Steer left" tabindex="-1">◀</button><button id="tR" class="tbtn steer" aria-label="Steer right" tabindex="-1">▶</button></div>
  <button id="pBrake" class="tbtn pedal brake" tabindex="-1">BRAKE</button>
  <button id="pGas" class="tbtn pedal gas" tabindex="-1">GAS</button>
  <button id="bHB" class="tbtn mini hb" tabindex="-1">HAND<br>BRAKE</button>
  <button id="bKick" class="tbtn mini kick" tabindex="-1">KICK</button>
  <button id="bBoost" class="tbtn mini boost" tabindex="-1">BOOST</button>
  <div id="tip" role="status"></div>
</div>

<div id="ui">
  <button id="btnSettings" class="cbtn" aria-label="Settings" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
  <button id="photoX" class="cbtn" tabindex="-1">📷 Done</button>
  <div id="classes" role="group" aria-label="Speed class">
    <button class="cls c1" data-i="0" tabindex="-1" aria-label="Speed class 1"><b>1</b><small>--</small></button>
    <button class="cls c2" data-i="1" tabindex="-1" aria-label="Speed class 2"><b>2</b><small>--</small></button>
    <button class="cls c3" data-i="2" tabindex="-1" aria-label="Speed class 3"><b>3</b><small>--</small></button>
  </div>
</div>

<div id="garage">
  <div id="gbar"><button id="gBack" type="button">◀ BACK</button><div id="gSlot"><span id="gSlotT">SLOT 1/5</span><i>+</i></div><div id="gCash"><span id="gCashT">$0</span><em>©</em><span id="gBest">0</span></div></div>
  <div id="gSpec"></div>
  <div id="gPick"><button id="gPrev" type="button" aria-label="Previous car">‹</button><div id="gOwned"></div><button id="gNext" type="button" aria-label="Next car">›</button></div>
  <button id="gSell" type="button"></button>
  <button id="gPlay" type="button">▶ Play</button>
</div>
<div id="menu"><div id="mLeft" class="panel mpanel"></div><div id="mRight" class="panel mpanel"></div></div>
<div id="rotate"><div>📱</div><b>Turn your phone sideways to drive!</b></div>
<script type="module" src="/main.js"></script>
</body>
</html>
