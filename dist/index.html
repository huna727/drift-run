<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f2f7a">
<title>Drift Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff;--line:#0b0820;--hot:#e3262e;--sun:#ffd23f;--mint:#7dff3a;--sky:#2f9bff;--grape:#34296f;--grape2:#1e1750;--hz:repeating-linear-gradient(-45deg,#2f9bff 0 7px,#fff 7px 11px,#2f9bff 11px 18px);
  --outl:0 3px 0 var(--line),2px 0 0 var(--line),-2px 0 0 var(--line),0 -2px 0 var(--line),2px 2px 0 var(--line),-2px 2px 0 var(--line);
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2f2f7a;color:var(--ink);font-family:"Russo One","Arial Black","Impact",system-ui,sans-serif;font-weight:400;letter-spacing:.2px;touch-action:none;overscroll-behavior:none}
body.touch{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block}
button{font-family:inherit}
#hud{position:fixed;inset:0;pointer-events:none;user-select:none;z-index:2}

/* ---------- HUD ---------- */
.panel{position:absolute;background:linear-gradient(180deg,rgba(52,41,111,.92),rgba(30,23,80,.92));border:5px solid transparent;border-image:var(--hz) 5;border-radius:0;padding:10px 16px;box-shadow:0 8px 22px rgba(0,0,0,.45);backface-visibility:hidden}
#drift{top:calc(18px + var(--sat));left:calc(84px + var(--sal));min-width:270px;border:0;border-image:none;background:linear-gradient(90deg,#d6212b 0 10px,rgba(22,40,66,.92) 10px);clip-path:polygon(0 0,100% 0,95% 100%,0 100%);padding:8px 34px 8px 24px}
#drift::after{content:"";position:absolute;left:10px;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#ffd23f var(--bank,0%),rgba(255,255,255,.12) 0);transition:background .12s linear}
#obj{font-size:13px;margin-top:4px;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#score{font-size:46px;line-height:1;font-style:italic;text-shadow:var(--outl)}
#mult{font-size:22px;font-weight:400;color:var(--sun);margin-left:8px;text-shadow:var(--outl)}
#meta{font-size:14px;opacity:.95;margin-top:4px}
#speedo{position:absolute;right:calc(104px + var(--sar));bottom:calc(14px + var(--sab));width:178px;height:178px}
#dial{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
#needle{transform-origin:100px 100px;transition:transform .08s linear}
#gearBox{position:absolute;right:-34px;top:-6px;width:58px;height:62px;background:#3a0b10;border:4px solid #0b0820;display:grid;place-items:center;font-size:46px;color:#ff3b30;font-style:italic;line-height:1;box-shadow:0 3px 0 #0b0820}
#spdBox{position:absolute;right:-48px;top:62px;min-width:76px;background:#1b1020;border:4px solid #0b0820;color:#ffd23f;text-align:right;padding:2px 8px;font-size:30px;font-style:italic;line-height:1.1}
#spdBox small{display:block;font-size:11px;color:#fff;opacity:.8}
#speed small{display:none}
#boostbar{position:absolute;right:-72px;bottom:0;width:20px;height:118px;background:#0b0820;border:3px solid #0b0820;display:flex;align-items:flex-end;overflow:hidden}
#boostfill{display:block;width:100%;height:100%;background:linear-gradient(0deg,#7dff3a,#ffd23f 65%,#e3262e);transition:height .12s linear}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:44px;font-style:italic;color:#8dff3a;-webkit-text-stroke:7px #0b0820;paint-order:stroke fill;text-shadow:0 5px 0 #0b0820;opacity:0;white-space:nowrap;pointer-events:none}
#toast.bad{color:#ff5a4d}
#toast.show{animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,12px) scale(.7) rotate(-4deg)}12%{opacity:1;transform:translate(-50%,0) scale(1.12) rotate(2deg)}25%{transform:translate(-50%,0) scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}

/* ---------- controls hint bar (always visible during play) ---------- */
#controls{position:absolute;left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(11,8,32,.72);border:2px solid rgba(255,255,255,.14);border-radius:24px;padding:6px 14px;font-size:12px;opacity:.92;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);white-space:nowrap;max-width:calc(100vw - 40px);overflow-x:auto;scrollbar-width:none;pointer-events:none;transition:opacity .3s ease}
#controls::-webkit-scrollbar{display:none}
#controls .ck{display:inline-flex;align-items:center;gap:6px;padding:0 6px}
#controls .key{background:#fff;color:var(--line);border:2px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:400;box-shadow:0 2px 0 var(--line);line-height:1.4}
#controls .lbl{opacity:.85;font-size:12px}
#controls .sep{opacity:.25;padding:0 2px}
body.photo #controls{opacity:0}
body.inmenu #controls{opacity:0}
body.touch #controls{display:none}
@media (max-width: 900px){#controls{font-size:11px;padding:5px 10px}}
@media (max-height: 520px){#controls{display:none}}

/* ---------- buttons ---------- */
#ui{position:fixed;inset:0;pointer-events:none;z-index:4}
.cbtn,.cls{pointer-events:auto;border:3px solid var(--line);cursor:pointer;color:var(--line);box-shadow:0 5px 0 var(--line),inset 0 3px 0 rgba(255,255,255,.45);transition:transform .08s ease,box-shadow .08s ease}
.cbtn:active,.cls:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line),inset 0 3px 0 rgba(255,255,255,.45)}
.cbtn:focus-visible,.cls:focus-visible{outline:3px solid #fff;outline-offset:2px}
#btnSettings{position:absolute;top:calc(18px + var(--sat));left:calc(18px + var(--sal));width:56px;height:56px;border-radius:50%;background:var(--sky);display:grid;place-items:center;padding:0}
#btnSettings svg{width:34px;height:34px;fill:var(--line);transition:transform .4s ease}
#btnSettings:hover svg{transform:rotate(90deg)}
#photoX{position:absolute;top:calc(18px + var(--sat));left:calc(86px + var(--sal));height:56px;padding:0 20px;border-radius:28px;background:var(--hot);color:#fff;font-size:20px;display:none;text-shadow:0 2px 0 var(--line)}
body.photo #photoX{display:block}
#classes{position:absolute;top:calc(18px + var(--sat));right:calc(18px + var(--sar));display:flex;gap:10px}
.cls{width:58px;height:66px;border-radius:6px;transform:skewX(-8deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.cls b{font-size:28px;font-weight:400}
.cls small{font-size:11px;font-weight:400;opacity:.75;margin-top:2px}
.cls.c1{background:var(--mint)}.cls.c2{background:var(--sun)}.cls.c3{background:var(--hot);color:#fff}
.cls.c3 small{opacity:.9}
.cls.on{transform:translateY(-3px) scale(1.12);outline:3px solid #fff;outline-offset:1px;box-shadow:0 8px 0 var(--line),inset 0 3px 0 rgba(255,255,255,.45)}
body.photo #classes,body.inmenu #ui{display:none}
body.photo #hud{display:none}

/* ---------- touch ---------- */
#touch{position:fixed;inset:0;display:none;z-index:3;touch-action:none}
body.touch.playing #touch{display:block}
.zone{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;touch-action:none}
#zoneL{left:0}#zoneR{right:0}
body.ctrl-tilt .zone,body.photo.touch .zone{pointer-events:auto}
.tbtn{position:absolute;border:4px solid var(--line);color:#fff;font-weight:400;cursor:pointer;touch-action:none;box-shadow:0 7px 0 var(--line),inset 0 4px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 var(--line);transition:transform .06s ease,box-shadow .06s ease;padding:0;line-height:1.05;opacity:.93}
.tbtn.down,.tbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line),inset 0 4px 0 rgba(255,255,255,.4);filter:brightness(1.15)}
.pedal{bottom:calc(16px + var(--sab));height:96px;border-radius:30px;font-size:24px}
.pedal.gas{right:calc(16px + var(--sar));width:132px;background:var(--mint)}
.pedal.brake{left:calc(16px + var(--sal));width:104px;background:var(--hot)}
.mini{width:70px;height:70px;border-radius:50%;font-size:12px}
.mini.hb{left:calc(20px + var(--sal));bottom:calc(128px + var(--sab));background:var(--sky);color:var(--line);text-shadow:none}
.mini.boost{right:calc(30px + var(--sar));bottom:calc(128px + var(--sab));background:var(--sun);color:var(--line);text-shadow:none;font-size:13px}
#steer{display:none}
.steer{bottom:calc(18px + var(--sab));width:88px;height:88px;border-radius:50%;font-size:34px;background:var(--sky);color:var(--line);text-shadow:none}
#tL{left:calc(16px + var(--sal))}#tR{left:calc(116px + var(--sal))}
body.ctrl-btn #steer{display:block}
body.ctrl-btn .pedal.brake{left:auto;right:calc(166px + var(--sar));width:92px}
body.ctrl-tilt .tbtn.pedal{pointer-events:none}
body.photo.touch .tbtn{display:none}
body.mp .tbtn,body.mp #steer{display:none!important}
#tip{position:absolute;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);background:#fff;color:var(--line);border:3px solid var(--line);border-radius:18px;padding:8px 16px;font-size:15px;box-shadow:0 4px 0 var(--line);opacity:0;pointer-events:none;white-space:nowrap;max-width:92vw}
#tip.show{animation:tip 5s ease-out forwards}
@keyframes tip{0%{opacity:0;transform:translate(-50%,10px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
#rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--grape2);font-size:26px;text-align:center;padding:24px;text-shadow:var(--outl)}
#rotate div{font-size:60px}
@media (orientation:portrait){body.touch.playing #rotate{display:flex}}

body.touch #drift{top:calc(10px + var(--sat));left:calc(78px + var(--sal));min-width:0;padding:5px 12px;border-radius:16px}
body.touch #btnSettings{top:calc(10px + var(--sat));left:calc(12px + var(--sal));width:52px;height:52px}
body.touch #classes{top:calc(10px + var(--sat));right:calc(12px + var(--sar));gap:8px}
body.touch .cls{width:52px;height:60px}
body.touch #score{font-size:30px}
body.touch #mult{font-size:16px}
body.touch #meta{font-size:11px;margin-top:2px}
body.touch #obj{font-size:11px;margin-top:2px}
body.touch #speedo{left:calc(50% - 20px);right:auto;transform:translateX(-50%);bottom:calc(10px + var(--sab));width:118px;height:118px}
body.touch #gearBox{width:40px;height:44px;font-size:30px;right:-26px}
body.touch #spdBox{font-size:20px;right:-34px;top:44px;min-width:56px}
body.touch #boostbar{display:none}
body.touch #toast{top:16%;font-size:30px}

/* ---------- multiplayer ---------- */
#mp{position:fixed;inset:0;pointer-events:none;z-index:2;display:none;user-select:none}
body.mp #mp{display:block}
#mp.off{display:none!important}
body.mp #hud,body.mp #classes{display:none}
.pv{position:absolute;overflow:hidden}
.divl{position:absolute;background:var(--line);box-shadow:0 0 0 2px #fff;z-index:1}
.pchip{position:absolute;top:10px;left:10px;padding:3px 14px;border:3px solid var(--line);border-radius:999px;color:var(--line);font-size:20px;box-shadow:0 3px 0 var(--line)}
.pv[data-i="0"] .pchip{left:calc(76px + var(--sal))}
.pips{position:absolute;top:12px;right:12px;font-size:22px;letter-spacing:3px;text-shadow:var(--outl)}
.psub{position:absolute;left:12px;bottom:10px;font-size:15px;text-shadow:var(--outl)}
.phint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--line);border:3px solid var(--line);border-radius:14px;padding:4px 12px;font-size:13px;box-shadow:0 3px 0 var(--line);opacity:1}
.pout{display:none;position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) rotate(-6deg);font-size:clamp(34px,7vw,80px);color:var(--hot);text-shadow:var(--outl)}
.pv.dead .pout{display:block}
.pv.dead{background:rgba(29,18,69,.35)}
.pv.board{background:linear-gradient(180deg,var(--grape),var(--grape2));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;font-size:clamp(18px,3vw,28px)}
.bt{font-size:1.2em;color:var(--sun);text-shadow:var(--outl)}
.brow{display:flex;align-items:center;gap:10px}
.pdot{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid var(--line);flex:none}
#mpBanner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(36px,9vw,92px);color:var(--sun);text-shadow:0 5px 0 var(--line),3px 0 0 var(--line),-3px 0 0 var(--line),0 -3px 0 var(--line),3px 3px 0 var(--line),-3px 3px 0 var(--line);white-space:nowrap;opacity:0;z-index:3}
#mpBanner.show{animation:bpop 1s ease-out forwards}
@keyframes bpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}22%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.05)}}
.shake{animation:shake .35s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){#toast.show,#tip.show{animation-duration:.01s}}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:auto 1fr auto;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease, visibility 0s linear .18s;will-change:opacity}
#menu:not(.off){opacity:1;visibility:visible;transition:opacity .18s ease, visibility 0s linear 0s}
#menu:not(.off) #mTop,#menu:not(.off) #mBody > *,#menu:not(.off) #mFoot{pointer-events:auto}
#mTop{display:flex;align-items:center;gap:16px;padding:calc(14px + var(--sat)) calc(22px + var(--sar)) 14px calc(22px + var(--sal));background:linear-gradient(180deg,rgba(11,8,32,.94) 0%,rgba(11,8,32,.55) 65%,rgba(11,8,32,0) 100%);position:relative}
#mTop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--sun) 0%,var(--hot) 45%,transparent 90%);opacity:.45;pointer-events:none}
.m-logo{font-size:26px;font-style:italic;letter-spacing:3px;transform:skewX(-8deg);transform-origin:left;text-shadow:0 3px 0 var(--line),0 0 24px rgba(255,210,63,.15);color:#fff}
.m-logo b{color:var(--sun);font-weight:400}
.m-pills{margin-left:auto;display:flex;gap:8px}
.m-pill{display:flex;align-items:baseline;gap:8px;padding:7px 15px;background:rgba(11,8,32,.75);border:2px solid rgba(255,255,255,.12);border-radius:999px;font-size:12px;line-height:1}
.m-pill .k{opacity:.55;letter-spacing:1.5px;font-size:10px;text-transform:uppercase}
.m-pill b{font-style:italic;font-size:16px;color:var(--sun);font-weight:400}
.m-cog{width:44px;height:44px;padding:0;flex:none;display:grid;place-items:center;background:rgba(11,8,32,.75);border:2px solid rgba(255,255,255,.12);border-radius:50%;color:#fff;cursor:pointer;transition:transform .2s ease,background .15s ease}
.m-cog:hover{background:var(--sky);transform:rotate(45deg)}
.m-cog svg{width:20px;height:20px;fill:currentColor}
#mBody{display:grid;grid-template-columns:minmax(380px,500px) 1fr;min-height:0;overflow:hidden;pointer-events:none}
#mBody > *{pointer-events:auto;min-height:0}
.m-main{overflow-y:auto;overflow-x:hidden;padding:22px 36px 22px 44px;display:flex;flex-direction:column;background:linear-gradient(90deg,rgba(11,8,32,.78) 0%,rgba(11,8,32,.5) 65%,rgba(11,8,32,0) 100%);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.m-side{overflow-y:auto;overflow-x:hidden;padding:22px 44px 22px 12px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;justify-self:end;background:linear-gradient(270deg,rgba(11,8,32,.78) 0%,rgba(11,8,32,.5) 65%,rgba(11,8,32,0) 100%);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.m-side:empty{display:none}
.m-screen{display:flex;flex-direction:column;min-height:0}
.m-title{margin:0 0 8px;font-size:clamp(38px,5.4vw,58px);font-style:italic;line-height:.92;letter-spacing:1px;text-shadow:0 5px 0 var(--line);transform:skewX(-6deg);transform-origin:left;color:#fff}
.m-title span{color:var(--sun)}
.m-sub{margin:0 0 20px;font-size:14px;opacity:.72;line-height:1.45;max-width:400px;font-weight:500;letter-spacing:.2px}
.m-actions{display:flex;flex-direction:column;gap:10px}
.m-launch-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-launch-row .gbtn{min-width:0}
.m-launch-row .gbtn.primary{font-size:22px;padding:17px 15px}
.m-launch-row .gbtn.primary .ic{width:40px;height:40px;font-size:24px}
.m-launch-row .gbtn.primary .tx span:first-child{font-size:24px}
.gbtn{display:flex;align-items:center;gap:14px;width:100%;padding:14px 20px;background:linear-gradient(135deg,rgba(52,41,111,.92),rgba(30,23,80,.92));border:2px solid rgba(255,255,255,.08);border-left:6px solid var(--sun);color:#fff;font:inherit;font-size:18px;font-style:italic;text-transform:uppercase;letter-spacing:1px;text-align:left;cursor:pointer;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:transform .12s ease,background .12s ease,border-color .12s ease}
.gbtn:hover{background:linear-gradient(135deg,rgba(255,210,63,.2),rgba(226,38,46,.2));border-left-color:var(--hot);transform:translateX(6px)}
.gbtn:active{transform:translateX(6px) translateY(2px)}
.gbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.gbtn .ic{flex:none;width:42px;height:42px;display:grid;place-items:center;font-size:22px;line-height:1;background:rgba(0,0,0,.28);border-radius:8px;color:var(--sun)}
.gbtn .tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.gbtn .tx small{font-size:11px;opacity:.6;letter-spacing:.5px;text-transform:none;font-style:normal;line-height:1.2}
.gbtn.primary{background:linear-gradient(135deg,var(--sun) 0%,#ff8a00 100%);border-left-color:#fff;color:var(--line);font-size:28px;padding:20px 24px}
.gbtn.primary:hover{background:linear-gradient(135deg,#ffe36b 0%,#ffa621 100%);border-left-color:var(--hot)}
.gbtn.primary .ic{font-size:32px;width:52px;height:52px;background:rgba(0,0,0,.12);color:var(--line)}
.gbtn.primary .tx small{color:rgba(11,8,32,.75)}
.gbtn.primary .tx span:first-child{font-size:30px}
.gbtn.blue{border-left-color:var(--sky)}.gbtn.blue .ic{color:#9fcaff}
.gbtn.red{border-left-color:var(--hot)}.gbtn.red .ic{color:#ff9aa1}
.gbtn.green{border-left-color:var(--mint)}.gbtn.green .ic{color:var(--mint)}
.gbtn.sm{width:auto;padding:10px 18px;font-size:14px;border-left-width:4px;gap:8px;flex:none}
.gbtn.sm .ic{width:26px;height:26px;font-size:13px;background:none}
.gbtn.sm .tx small{display:none}
.gbtn.dis,.gbtn:disabled{filter:brightness(.55);cursor:default;transform:none !important;border-left-color:rgba(255,255,255,.2) !important;background:linear-gradient(135deg,rgba(52,41,111,.92),rgba(30,23,80,.92)) !important;color:#fff !important}
.m-list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;padding:14px 18px;width:100%;background:rgba(11,8,32,.55);border:2px solid rgba(255,255,255,.06);border-left:4px solid transparent;color:#fff;font:inherit;text-align:left;cursor:pointer;transition:background .12s ease,border-color .12s ease,transform .12s ease}
.card:hover{background:rgba(255,255,255,.08);border-left-color:var(--sun);transform:translateX(3px)}
.card.sel{background:linear-gradient(90deg,rgba(226,38,46,.4),rgba(52,41,111,.6));border-left-color:var(--sun)}
.card.sel .ctag{color:#fff}
.card .cname{font-size:20px;font-style:italic;letter-spacing:.5px}
.card .ctag{color:var(--sun);font-size:14px;font-style:italic;white-space:nowrap}
.card .cdesc{grid-column:1/-1;font-size:12px;opacity:.7;line-height:1.4;margin-top:6px;font-weight:500}
#mFoot{display:flex;align-items:center;gap:10px;padding:14px calc(22px + var(--sar)) calc(14px + var(--sab)) calc(22px + var(--sal));background:linear-gradient(0deg,rgba(11,8,32,.94) 0%,rgba(11,8,32,.55) 65%,rgba(11,8,32,0) 100%);position:relative}
#mFoot:empty{display:none}
